<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fleet Pulse motif: one tick per device, height = severity, on the page plane. -->
  <rect width="32" height="32" rx="6" fill="#0a1013"/>
  <!-- baseline -->
  <rect x="5" y="25" width="24" height="1.5" rx="0.75" fill="#383835"/>
  <!-- ticks, worst first: critical full, serious mid, warning low, offline stub, good short -->
  <rect x="6"  y="7"  width="3" height="18" rx="0.75" fill="#d03b3b"/>
  <rect x="11" y="14" width="3" height="11" rx="0.75" fill="#ec835a"/>
  <rect x="16" y="18" width="3" height="7"  rx="0.75" fill="#fab219"/>
  <rect x="21" y="21" width="3" height="4"  rx="0.75" fill="#56605f"/>
  <rect x="26" y="22" width="3" height="3"  rx="0.75" fill="#0ca30c"/>
</svg>
